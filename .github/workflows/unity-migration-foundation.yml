name: Unity migration validation

on:
  push:
    branches: [unity-migration]
  pull_request:
    branches: [main, unity-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-and-portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.415
      - name: Verify regressions, Unity contract, seeded captures and native file interoperability
        run: bash Migration/Tools/validate.sh
      - name: Package committed Unity source with a short root and SHA256 receipt
        run: python3 Migration/Tools/package_unity_source.py --output Migration/artifacts/CrowdSim-UnityProject-M11.zip
      - name: Retain downloadable Unity source
        uses: actions/upload-artifact@v4
        with:
          name: CrowdSim-UnityProject-M11
          path: Migration/artifacts/CrowdSim-UnityProject-M11.zip
          if-no-files-found: error
      - name: Retain actual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-results
          path: Migration/artifacts/tests/*.trx
          if-no-files-found: warn

# This job does not execute Unity. EditMode/PlayMode and first-import acceptance
# remain local checks until a licensed Editor runner is configured.
